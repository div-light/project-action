name: Orange HRM Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:            # manual run button
  schedule:
    - cron: "0 2 * * *"         # nightly regression

permissions:
  contents: read                # least privilege

concurrency:                    # cancel outdated runs on the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-project
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    needs: lint                 # fail fast: skip slow tests if lint fails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEADLESS: "1"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-project

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium

      - name: Run tests
        run:
          uv run pytest -n auto --reruns 1
          --html=artifacts/report.html --self-contained-html


      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn   # warn, not ignore