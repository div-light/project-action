[project]
name = "project-action"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.10.0",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
project-action = "project_action:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
